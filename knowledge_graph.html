<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Solarz Knowledge Graph</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: -apple-system, sans-serif; }
  svg { width: 100vw; height: 100vh; }
  .link { stroke-opacity: 0.7; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
  .node text { fill: #ccc; font-size: 10px; pointer-events: none; }
  .node:hover text { fill: #fff; font-size: 12px; font-weight: bold; }
  #tooltip {
    position: absolute; background: rgba(0,0,0,0.85); color: #eee;
    padding: 10px 14px; border-radius: 6px; font-size: 13px;
    pointer-events: none; display: none; max-width: 350px;
    border: 1px solid #444;
  }
  #tooltip .title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  #tooltip .type { color: #aaa; font-size: 11px; }
  #tooltip .desc { margin-top: 6px; color: #ccc; }
  #tooltip .stats { margin-top: 6px; color: #888; font-size: 11px; }
  #controls {
    position: absolute; top: 12px; left: 12px; color: #aaa;
    font-size: 12px; background: rgba(0,0,0,0.6); padding: 10px;
    border-radius: 6px;
  }
  #controls input { width: 200px; padding: 4px; background: #333;
    border: 1px solid #555; color: #eee; border-radius: 3px; }
  #legend {
    position: absolute; bottom: 12px; left: 12px; color: #aaa;
    font-size: 11px; background: rgba(0,0,0,0.6); padding: 10px;
    border-radius: 6px;
  }
  .legend-item { display: flex; align-items: center; margin: 3px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; display: inline-block; }
  #search-results { color: #888; margin-top: 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="tooltip"></div>
<div id="controls">
  <div><strong style="color:#eee">Solarz Knowledge Graph</strong></div>
  <div style="margin-top:6px">
    <input type="text" id="search" placeholder="Search concepts..."
           oninput="searchNodes(this.value)">
    <div id="search-results"></div>
  </div>
  <div style="margin-top:6px;color:#666">
    Drag nodes · Scroll to zoom · Click to highlight · Dbl-click to reset
  </div>
</div>
<div id="legend">
  <div style="margin-bottom:4px"><strong>Types</strong></div>
  <div class="legend-item"><span class="legend-dot" style="background:#4A90D9"></span>object</div><div class="legend-item"><span class="legend-dot" style="background:#E74C3C"></span>theorem</div><div class="legend-item"><span class="legend-dot" style="background:#F39C12"></span>conjecture</div><div class="legend-item"><span class="legend-dot" style="background:#2ECC71"></span>technique</div><div class="legend-item"><span class="legend-dot" style="background:#9B59B6"></span>identity</div><div class="legend-item"><span class="legend-dot" style="background:#1ABC9C"></span>formula</div><div class="legend-item"><span class="legend-dot" style="background:#E67E22"></span>person</div><div class="legend-item"><span class="legend-dot" style="background:#3498DB"></span>definition</div>
</div>
<svg></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const data = {"nodes": [{"id": "variable elliptic structures", "label": "Variable Elliptic Structures", "type": "definition", "papers": 1, "degree": 1, "description": "A mathematical framework for analyzing structures that vary in ellipticity on the plane.", "color": "#3498DB"}, {"id": "structure polynomial", "label": "Structure Polynomial", "type": "object", "papers": 1, "degree": 0, "description": "A polynomial that describes the structure of a variable elliptic system.", "color": "#4A90D9"}, {"id": "ellipticity", "label": "Ellipticity", "type": "object", "papers": 1, "degree": 1, "description": "A property of differential operators that ensures certain regularity and solvability conditions.", "color": "#4A90D9"}, {"id": "generalized cauchy\u2013riemann operators", "label": "Generalized Cauchy\u2013Riemann Operators", "type": "object", "papers": 1, "degree": 1, "description": "Operators that generalize the classical Cauchy-Riemann equations in complex analysis.", "color": "#4A90D9"}, {"id": "variable cauchy\u2013riemann system", "label": "Variable Cauchy\u2013Riemann System", "type": "object", "papers": 1, "degree": 1, "description": "A system of equations that extends the Cauchy-Riemann equations to variable elliptic structures.", "color": "#4A90D9"}, {"id": "universal burgers transport", "label": "Universal Burgers Transport", "type": "theorem", "papers": 1, "degree": 1, "description": "A theorem that describes transport phenomena in the context of variable elliptic structures.", "color": "#E74C3C"}, {"id": "rigidity", "label": "Rigidity", "type": "definition", "papers": 1, "degree": 2, "description": "A condition where the fixed and moving complex structures align in a specific manner.", "color": "#3498DB"}, {"id": "canonical spectral parameter", "label": "Canonical Spectral Parameter", "type": "object", "papers": 1, "degree": 0, "description": "A parameter used in the analysis of spectral properties of differential operators.", "color": "#4A90D9"}, {"id": "obstruction field", "label": "Obstruction Field", "type": "object", "papers": 1, "degree": 1, "description": "A field that represents the obstructions to certain transport phenomena in the system.", "color": "#4A90D9"}, {"id": "product rule", "label": "Product Rule", "type": "technique", "papers": 1, "degree": 1, "description": "A rule in calculus that describes how to differentiate products of functions.", "color": "#2ECC71"}, {"id": "inhomogeneous coefficients", "label": "Inhomogeneous Coefficients", "type": "object", "papers": 1, "degree": 1, "description": "Coefficients in differential equations that do not have a uniform structure.", "color": "#4A90D9"}, {"id": "elliptic system", "label": "elliptic system", "type": "definition", "papers": 1, "degree": 3, "description": "A system of partial differential equations that satisfies the ellipticity condition.", "color": "#3498DB"}, {"id": "ellipticity constant", "label": "ellipticity constant", "type": "object", "papers": 1, "degree": 1, "description": "A parameter that indicates the degree of ellipticity of a system.", "color": "#4A90D9"}, {"id": "transport-theoretic invariant", "label": "transport-theoretic invariant", "type": "object", "papers": 1, "degree": 0, "description": "An invariant that helps in solving the elliptic system by transport methods.", "color": "#4A90D9"}, {"id": "transport obstruction g", "label": "transport obstruction G", "type": "object", "papers": 1, "degree": 2, "description": "A measure that indicates whether the structure of the elliptic system moves coherently.", "color": "#4A90D9"}, {"id": "beltrami coefficient \u00b5", "label": "Beltrami coefficient \u00b5", "type": "object", "papers": 1, "degree": 1, "description": "A coefficient that measures the distance from the standard complex structure.", "color": "#4A90D9"}, {"id": "principal symbol", "label": "principal symbol", "type": "object", "papers": 1, "degree": 1, "description": "A matrix associated with a differential operator that helps determine the ellipticity of the system.", "color": "#4A90D9"}, {"id": "first-order pde", "label": "first-order PDE", "type": "object", "papers": 1, "degree": 0, "description": "Partial differential equations that involve only first derivatives.", "color": "#4A90D9"}, {"id": "initial value problem", "label": "initial value problem", "type": "definition", "papers": 1, "degree": 1, "description": "A problem that seeks to find a solution to a differential equation given initial conditions.", "color": "#3498DB"}, {"id": "analytic data", "label": "analytic data", "type": "object", "papers": 1, "degree": 1, "description": "Data that is smooth and can be represented by a convergent power series.", "color": "#4A90D9"}, {"id": "burgers transform", "label": "Burgers transform", "type": "definition", "papers": 1, "degree": 4, "description": "A nonlinear bijection between holomorphic functions and rigid variable elliptic structures.", "color": "#3498DB"}, {"id": "holomorphic functions", "label": "holomorphic functions", "type": "object", "papers": 1, "degree": 3, "description": "Functions that are complex differentiable in a neighborhood of every point in their domain.", "color": "#4A90D9"}, {"id": "rigid variable elliptic structures", "label": "rigid variable elliptic structures", "type": "object", "papers": 1, "degree": 1, "description": "Structures on the plane that exhibit rigidity and are associated with elliptic functions.", "color": "#4A90D9"}, {"id": "complex burgers equation", "label": "complex Burgers equation", "type": "formula", "papers": 1, "degree": 1, "description": "An equation given by \u03bbx + \u03bb\u03bby = 0, which the output of the Burgers transform satisfies.", "color": "#1ABC9C"}, {"id": "c1 function", "label": "C1 function", "type": "object", "papers": 1, "degree": 1, "description": "A function that is continuously differentiable.", "color": "#4A90D9"}, {"id": "hol(u, c+)", "label": "Hol(U, C+)", "type": "object", "papers": 1, "degree": 1, "description": "The space of holomorphic functions mapping from U to C+.", "color": "#4A90D9"}, {"id": "obstruction formula", "label": "obstruction formula", "type": "formula", "papers": 1, "degree": 1, "description": "A formula that quantifies the cost of non-holomorphicity at the level of the initial data.", "color": "#1ABC9C"}, {"id": "f-analytics hierarchy", "label": "f-analytics hierarchy", "type": "definition", "papers": 1, "degree": 1, "description": "A classification of functions based on their complexity and the resulting structures.", "color": "#3498DB"}, {"id": "affine automorphisms", "label": "affine automorphisms", "type": "object", "papers": 1, "degree": 0, "description": "Transformations that preserve the structure of the complex plane.", "color": "#4A90D9"}, {"id": "jacobian-twisted multiplicativity", "label": "Jacobian-twisted multiplicativity", "type": "definition", "papers": 1, "degree": 1, "description": "A property that the propagator Pf satisfies, which deforms the seed algebra.", "color": "#3498DB"}], "links": [{"source": "variable elliptic structures", "target": "ellipticity", "relation": "defines", "detail": "Variable elliptic structures are characterized by their ellipticity properties."}, {"source": "generalized cauchy\u2013riemann operators", "target": "variable cauchy\u2013riemann system", "relation": "generalizes", "detail": "Generalized Cauchy\u2013Riemann operators extend the classical system to variable contexts."}, {"source": "universal burgers transport", "target": "rigidity", "relation": "related_to", "detail": "The concept of rigidity is connected to the transport phenomena described by the Universal Burgers Transport theorem."}, {"source": "obstruction field", "target": "rigidity", "relation": "implies", "detail": "The presence of an obstruction field can indicate conditions of rigidity in the system."}, {"source": "product rule", "target": "inhomogeneous coefficients", "relation": "specializes_to", "detail": "The product rule can be applied in contexts involving inhomogeneous coefficients."}, {"source": "elliptic system", "target": "ellipticity constant", "relation": "defines", "detail": "The ellipticity constant is a characteristic of the elliptic system."}, {"source": "transport obstruction g", "target": "elliptic system", "relation": "related_to", "detail": "The transport obstruction G indicates structural properties of the elliptic system."}, {"source": "beltrami coefficient \u00b5", "target": "transport obstruction g", "relation": "related_to", "detail": "The Beltrami coefficient measures the distance from standard structure, while G measures coherence."}, {"source": "initial value problem", "target": "analytic data", "relation": "uses", "detail": "The initial value problem is well posed for analytic data."}, {"source": "principal symbol", "target": "elliptic system", "relation": "is_instance_of", "detail": "The principal symbol is a key component in determining the properties of the elliptic system."}, {"source": "burgers transform", "target": "holomorphic functions", "relation": "uses", "detail": "The Burgers transform maps holomorphic functions to rigid variable elliptic structures."}, {"source": "burgers transform", "target": "complex burgers equation", "relation": "implies", "detail": "The output of the Burgers transform satisfies the complex Burgers equation."}, {"source": "c1 function", "target": "holomorphic functions", "relation": "implies", "detail": "Any C1 function whose implicit solution satisfies the complex Burgers equation must be holomorphic."}, {"source": "hol(u, c+)", "target": "burgers transform", "relation": "related_to", "detail": "Hol(U, C+) is identified as the maximal seed space compatible with rigidity."}, {"source": "obstruction formula", "target": "holomorphic functions", "relation": "quantifies", "detail": "The obstruction formula quantifies the cost of non-holomorphicity related to holomorphic functions."}, {"source": "f-analytics hierarchy", "target": "rigid variable elliptic structures", "relation": "generalizes", "detail": "The f-analytics hierarchy characterizes different classes of functions leading to rigid variable elliptic structures."}, {"source": "jacobian-twisted multiplicativity", "target": "burgers transform", "relation": "defines", "detail": "Jacobian-twisted multiplicativity is a property that defines how the propagator interacts with the Burgers transform."}]};
const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));
const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(80))
  .force("charge", d3.forceManyBody().strength(-120))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => nr(d) + 2));
const link = g.append("g").selectAll("line").data(data.links).join("line")
  .attr("class","link").attr("stroke","#7799BB").attr("stroke-width",1.5);
const node = g.append("g").selectAll("g").data(data.nodes).join("g")
  .attr("class","node")
  .call(d3.drag().on("start",ds).on("drag",dd).on("end",de));
function nr(d) { return Math.max(4, Math.min(20, 3 + d.degree * 1.2)); }
node.append("circle").attr("r", d => nr(d)).attr("fill", d => d.color).attr("opacity", 0.85);
node.append("text").text(d => d.degree >= 3 ? d.label : "").attr("x", d => nr(d)+3).attr("y", 3);
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  tooltip.style("display","block")
    .html(`<div class="title">${d.label}</div><div class="type">${d.type}</div>
           ${d.description ? `<div class="desc">${d.description}</div>` : ''}
           <div class="stats">${d.papers} papers · ${d.degree} connections</div>`);
}).on("mousemove", (e) => {
  tooltip.style("left",(e.pageX+15)+"px").style("top",(e.pageY-10)+"px");
}).on("mouseout", () => tooltip.style("display","none"));
node.on("click", (e, d) => {
  const nb = new Set([d.id]);
  data.links.forEach(l => { if(l.source.id===d.id) nb.add(l.target.id); if(l.target.id===d.id) nb.add(l.source.id); });
  node.select("circle").attr("opacity", n => nb.has(n.id)?1:0.1);
  node.select("text").attr("fill", n => nb.has(n.id)?"#fff":"#333").text(n => nb.has(n.id)?n.label:"");
  link.attr("stroke-opacity", l => l.source.id===d.id||l.target.id===d.id?1:0.08);
});
svg.on("dblclick", () => {
  node.select("circle").attr("opacity",0.85);
  node.select("text").attr("fill","#ccc").text(d => d.degree>=3?d.label:"");
  link.attr("stroke-opacity",0.7);
});
function searchNodes(q) {
  const r=document.getElementById("search-results");
  if(!q) { node.select("circle").attr("opacity",0.85); node.select("text").attr("fill","#ccc").text(d=>d.degree>=3?d.label:""); link.attr("stroke-opacity",0.7); r.textContent=""; return; }
  const m=data.nodes.filter(n=>n.id.includes(q.toLowerCase())||n.label.toLowerCase().includes(q.toLowerCase()));
  const ids=new Set(m.map(x=>x.id));
  node.select("circle").attr("opacity",n=>ids.has(n.id)?1:0.1);
  node.select("text").attr("fill",n=>ids.has(n.id)?"#fff":"#333").text(n=>ids.has(n.id)?n.label:"");
  r.textContent=`${m.length} matches`;
}
simulation.on("tick", () => {
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
});
function ds(e) { if(!e.active) simulation.alphaTarget(0.3).restart(); e.subject.fx=e.subject.x; e.subject.fy=e.subject.y; }
function dd(e) { e.subject.fx=e.x; e.subject.fy=e.y; }
function de(e) { if(!e.active) simulation.alphaTarget(0); e.subject.fx=null; e.subject.fy=null; }
</script>
</body>
</html>
